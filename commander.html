<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> </title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Oi&family=Parisienne&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand" href="./index.html"
          ><img
            src="./assets/logo.png"
            alt="Logo CakeCraft"
            height="80"
            class="rounded-4"
        /></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a
                class="nav-link caveat-brush-regular text-center"
                href="./index.html"
                ><i class="fa-solid fa-house"></i>Accueil</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link caveat-brush-regular active text-center"
                aria-current="page"
                href="#"
                ><i class="fa-solid fa-cart-shopping"></i>Commander en ligne</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link caveat-brush-regular text-center"
                href="./historique.html"
              >
                <i class="fa-solid fa-clock-rotate-left"></i>Historique</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <main class="p-2 bg-light d-flex justify-content-center align-items-center">
      <section
        id="order-section"
        class="container my-4 d-flex flex-column flex-md-row justify-content-around gap-md-1 gap-4"
      >
        <div
          id="cake-container"
          class="border border-3 rounded-4 p-2 bg-white w-100 w-md-75 d-flex justify-content-center align-items-center"
        ></div>
        <div>
          <h2 class="text-center mb-4 parisienne-regular fs-2 fw-bold">
            <span><i class="fa-solid fa-cart-shopping fs-2"></i></span> Passez
            votre commande
          </h2>
          <form
            id="order-form"
            class="d-flex flex-column gap-3 w-100 border border-2 rounded-4 p-3"
          >
            <div class="form-group">
              <label
                for="base-cake"
                class="form-label caveat-brush-regular fs-5"
                >Saveur de base:</label
              >
              <select id="base-cake" class="form-select w-md-50" required>
                <option value="" disabled selected>
                  Choisissez une saveur
                </option>
                <option value="base_chocolat">Chocolat</option>
                <option value="base_vanille">Vanille</option>
              </select>
            </div>
            <div class="form-group">
              <label
                for="cake-flavor"
                class="form-label caveat-brush-regular fs-5"
                >Saveur de glaçage:</label
              >
              <select id="cake-flavor" class="form-select w-md-50" required>
                <option value="" disabled selected>
                  Choisissez une saveur
                </option>
                <option value="vanille">Vanille</option>
                <option value="chocolat">Chocolat</option>
                <option value="fraise">Fraise</option>
              </select>
            </div>
            <div class="form-group">
              <input type="checkbox" name="whipped-cream" id="whipped-cream" />
              <label for="whipped-cream" class="caveat-brush-regular fs-5"
                >Crème fouettée</label
              >
            </div>
            <div class="form-group">
              <input type="checkbox" name="cherry" id="cherry" />
              <label for="cherry" class="caveat-brush-regular fs-5"
                >Cerise</label
              >
            </div>
            <section
              class="d-flex flex-column w-100 flex-md-row justify-content-around align-items-center gap-3"
            >
              <div class="form-group w-md-50 w-100">
                <label for="name" class="caveat-brush-regular fs-5">
                  Nom et prénom:</label
                >
                <input
                  type="text"
                  id="name"
                  name="name"
                  class="form-control w-100"
                  required
                />
              </div>
              <div class="form-group w-md-50 w-100">
                <label for="address" class="caveat-brush-regular fs-5">
                  Adresse :</label
                >
                <input
                  type="text"
                  id="address"
                  name="address"
                  class="form-control w-100"
                  required
                />
              </div>
            </section>
            <div>
              <button type="reset" class="btn btn-danger">Annuler</button>
              <button type="submit" class="btn btn-success">Commander</button>
            </div>
          </form>
        </div>
      </section>
    </main>
    <footer>
      <section
        class="d-flex flex-column flex-md-row justify-content-around align-items-center gap-4 py-3 flex-wrap"
      >
        <div>
          <h5 class="text-left mb-3 fs-4 caveat-brush-regular">
            Contactez-nous
          </h5>
          <p class="text-left mb-1">
            <i class="fa-solid fa-phone"></i> +481 123 4567
          </p>
          <p class="text-left mb-1">
            <i class="fa-solid fa-envelope"></i> contact@cakecraft.ca
          </p>
          <p class="text-left mb-1">
            <i class="fa-solid fa-location-dot"></i> 123 Rue des Délices, QC,
            Canada
          </p>
        </div>
        <div>
          <h5 class="text-center mb-3 caveat-brush-regular">Suivez-nous</h5>
          <div class="d-flex justify-content-center gap-4">
            <a
              href="https://facebook.com"
              target="_blank"
              class="custom-pink-bg fs-4 rounded-3 px-2 text-center"
              ><i class="fa-brands fa-facebook"></i
            ></a>
            <a
              href="https://instagram.com"
              target="_blank"
              class="custom-pink-bg fs-4 rounded-3 px-2 text-center"
              ><i class="fa-brands fa-instagram"></i
            ></a>
            <a
              href="https://x.com"
              target="_blank"
              class="custom-pink-bg fs-4 rounded-3 px-2 text-center"
              ><i class="fa-brands fa-twitter"></i
            ></a>
            <a
              href="https://pinterest.com"
              target="_blank"
              class="custom-pink-bg fs-4 rounded-3 px-2 text-center"
              ><i class="fa-brands fa-pinterest"></i
            ></a>
          </div>
        </div>
      </section>
      <hr class="mx-2 mx-md-5" />
      <div class="container text-dark text-center py-2">
        <p>&copy; 2025 CakeCraft. Tous droits réservés.</p>
      </div>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://kit.fontawesome.com/0fd512a673.js"
      crossorigin="anonymous"
    ></script>
    <script src="./js//commander.js"></script>
  </body>
</html>
